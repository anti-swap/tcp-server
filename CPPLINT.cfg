# How this project is linted.
#
# The header is written to 80 columns, which is what cpplint asks for anyway,
# so this file no longer negotiates a limit. It used to ask for 100: the price
# was 240-odd line-length findings burying everything else the check had to
# say, and a limit nobody else is holding is not a limit, it is noise. What is
# left here is the one question the project answers for itself. Run with:
#
#     python3 -m cpplint include/tcp-server-mt.h
#
# Filtered, and why:
#
# legal/copyright -- there is no established license header policy for this
#     repository. Filtering it is a statement that the check is not applicable,
#     not that it was ever run and failed.

set noparent
linelength=80
filter=-legal/copyright
extensions=h
headers=h
