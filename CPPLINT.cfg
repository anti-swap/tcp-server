# How this project is linted.
#
# Without this file, `cpplint tcp-server-mt.h` reports 178 line-length findings
# for a file written to 100 columns, which buries everything else. The column
# limit here matches what the code actually does rather than what Google's guide
# says, because a lint runs check has to agree with itself before anyone will
# read it. Run with:
#
#     python3 -m cpplint tcp-server-mt.h
#
# Filtered, and why:
#
# legal/copyright -- there is no established license header policy for this
#     repository. Filtering it is a statement that the check is not applicable,
#     not that it was ever run and failed.

set noparent
linelength=100
filter=-legal/copyright
extensions=h
headers=h
