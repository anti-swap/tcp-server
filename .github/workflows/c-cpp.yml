# What this job can claim, and what it cannot.
#
# verify/run-in-wsl.sh is the real gate: seven suites compiled and run under
# plain, asan+ubsan and tsan, plus cpplint on the header. All of it is Linux
# work, so an ubuntu-latest runner covers the interesting half of the project.
#
# verify/build.sh is deliberately absent. It type-checks the header against a
# hand-written POSIX shim on Windows -- that check exists because this desk
# cannot produce a real Linux binary, not because Linux lacks anything, and the
# compile below already carries the same warning set. Putting a Windows runner
# behind it would mainly buy new ways to fail for MSYS reasons.
#
# One thing this job does that no local run has managed: GitHub's runner has a
# real kernel. send_results' hup/err case asks the host whether EPOLLHUP|EPOLLERR
# are actually delivered and prints [SKIP] when they are not. On WSL they are
# not -- an aborted connection arrives as an ordinary FIN -- so that case sat
# unexecuted through three review rounds. Here it runs and asserts. The last
# step files the verdict, per configuration, where anyone can read it back.
name: verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux:
    runs-on: ubuntu-latest
    # 21 runs of 7 suites. Each one has a 180s timeout inside the script, so a
    # hung case presents as a failure rather than as an idle job.
    timeout-minutes: 60

    steps:
      # v5 rather than v4: v4 still runs on Node 20, which the runner now accepts
      # only with a deprecation annotation against .github/workflows. That
      # warning crowds out the ones this job is actually trying to file.
      - uses: actions/checkout@v5

      # The script installs build-essential itself if g++ is missing; doing it
      # here keeps that branch from ever being taken, and hides its apt chatter.
      - name: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-pip

      - name: cpplint
        # Ubuntu marks its system python externally-managed, so the plain
        # install is refused. The fallback is for images that predate that.
        run: |
          python3 -m pip install --break-system-packages -q cpplint ||
            python3 -m pip install -q cpplint
          python3 -m cpplint --version

      - name: seven suites under plain, asan+ubsan and tsan
        env:
          ENABLE_ASAN: "1"
          ENABLE_TSAN: "1"
        run: |
          # pipefail so the tee cannot launder a failing suite into a green job.
          set -o pipefail
          bash verify/run-in-wsl.sh 2>&1 | tee /tmp/verify-run.log

      # Three reasons this exists, and the second one is why the first version
      # of it was not enough.
      #
      # 1. A [SKIP] changes no exit code. "asserted and passed" and "asked the
      #    kernel and declined" leave the suite looking exactly alike, so the
      #    truth about hup/err -- the one case that could never execute locally
      #    -- stayed buried in a log nobody opens. An annotation can be read back
      #    off the checks API by anyone, signed into GitHub or not.
      # 2. A case is free to run under plain and decline under tsan. The first
      #    version read only the first hup/err paragraph, so a skip in any later
      #    configuration would have been reported as that first verdict -- the
      #    same false comfort this step exists to remove, in a new place. It now
      #    reports one verdict per configuration.
      # 3. Anything else that declined gets named together with the pass it fell
      #    in, because "1 case skipped" invites every reader to assume it was
      #    not theirs.
      #
      # It stays a warning and not a failure on purpose: whether a kernel that
      # declines is a kernel worth supporting is a judgement, not a CI policy.
      - name: what this kernel was willing to tell us
        if: always()
        run: |
          log=/tmp/verify-run.log
          if [ ! -f "$log" ]; then
            echo "::warning title=skipped cases::the suite left no log to read"
            exit 0
          fi

          # Every [SKIP] line with the pass it happened in. Each configuration
          # announces itself with "---- running [title] ----", so whichever one
          # was last seen owns every line after it.
          report=$(
              awk '
                BEGIN { cfg="?" }
                /^---- running \[/ {
                    cfg=$0; sub(/^---- running \[/,"",cfg); sub(/\].*/,"",cfg)
                }
                /\[SKIP\]/ { line=$0; sub(/^[ \t]+/,"",line); print cfg ": " line }
              ' "$log"
          )
          echo "::group::cases that declined to assert"
          if [ -n "$report" ]; then printf '%s\n' "$report"; else echo "(none)"; fi
          echo "::endgroup::"
          while IFS= read -r line; do
              [ -n "$line" ] &&
                  printf '::notice title=case declined to assert::%s\n' "$line"
          done <<< "$report"

          # One hup/err verdict per configuration: the paragraph opening with its
          # title, taken up to the blank line that closes it. A fixed number of
          # lines instead drags in the next case's heading.
          verdicts=$(
              awk '
                BEGIN { cfg="?" }
                function flush() {
                    if (f) printf "%s\t%s\n", (buf ~ /\[SKIP\]/ ? "skip" : "ran"), cfg
                    f=0
                }
                /^---- running \[/ {
                    flush()
                    cfg=$0; sub(/^---- running \[/,"",cfg); sub(/\].*/,"",cfg)
                    next
                }
                /^hup\/err:/ { f=1; buf=$0; next }
                f && NF==0 { flush(); next }
                f { buf = buf " " $0 }
                END { flush() }
              ' "$log"
          )
          if [ -z "$verdicts" ]; then
              echo "::warning title=hup/err::no such case in the suite output"
              exit 0
          fi
          ran=$(printf '%s\n' "$verdicts" | grep -c '^ran' || true)
          skipped=$(printf '%s\n' "$verdicts" | grep -c '^skip' || true)
          detail=$(printf '%s\n' "$verdicts" | tr '\t' '=' |
                   paste -sd ';' - | sed 's/;/; /g')
          if [ "$skipped" -eq 0 ]; then
              echo "::notice title=hup/err ran in $ran configuration(s)::$detail"
          else
              echo "::warning title=hup/err skipped in $skipped of $((ran + skipped)) configuration(s)::$detail"
          fi
